name: SLO

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - master
      - release-*
  workflow_dispatch:
    inputs:
      github_issue:
        description: "GitHub issue number where the SLO results will be reported"
        required: true
      baseline_ref:
        description: "Baseline commit/branch/tag to compare against (leave empty to auto-detect merge-base with main)"
        required: false
      slo_workload_duration_seconds:
        description: "Duration of the SLO workload in seconds"
        required: false
        default: "600"
      slo_workload_read_max_rps:
        description: "Maximum read RPS for the SLO workload"
        required: false
        default: "1000"
      slo_workload_write_max_rps:
        description: "Maximum write RPS for the SLO workload"
        required: false
        default: "100"

jobs:
  ydb-slo-action:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'SLO')

    name: Run YDB SLO Tests
    runs-on: "large-runner"

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: database-sql-table
            path: database/sql/table
          - name: database-sql-query
            path: database/sql/query
          - name: native-query
            path: native/query
          - name: native-table
            path: native/table
          - name: native-table-over-query-service
            path: native/table-over-query-service
          - name: native-bulk-upsert
            path: native/bulk-upsert
            command: "-batch-size=10"
          - name: native-table-node-hints
            path: native/table-node-hints
            command: "-min-partition-count=10"
            metrics_yaml: |
              metrics:
                - name: node_hints_misses
                  type: instant
                  query: sum by(ref) (workload_node_hints_misses)
          - name: native-query-node-hints
            path: native/query-node-hints
            command: "-min-partition-count=10"
            metrics_yaml: |
              metrics:
                - name: node_hints_misses
                  type: instant
                  query: sum by(ref) (workload_node_hints_misses)

    concurrency:
      group: slo-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: true

    steps:
      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          COMPOSE_VERSION=2.40.3

          sudo curl -L https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq && \
            sudo chmod +x /usr/local/bin/yq

          echo "Updating Docker plugins..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          yq --version
          docker --version
          docker compose version

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.30.1

      - name: Checkout current version
        uses: actions/checkout@v5
        with:
          path: current
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        run: |
          cd current
          if [[ -n "${{ inputs.baseline_ref }}" ]]; then
            BASELINE="${{ inputs.baseline_ref }}"
          else
            BASELINE=$(git merge-base HEAD origin/master)
          fi
          echo "sha=$BASELINE" >> $GITHUB_OUTPUT

          # Try to determine a human-readable ref name for baseline
          # Check if baseline is on master
          if git merge-base --is-ancestor $BASELINE origin/master && \
             [ "$(git rev-parse origin/master)" = "$BASELINE" ]; then
            BASELINE_REF="master"
          else
            # Try to find a branch containing this commit
            BRANCH=$(git branch -r --contains $BASELINE | grep -v HEAD | head -1 | sed 's/.*\///' || echo "")
            if [ -n "$BRANCH" ]; then
              BASELINE_REF="${BRANCH}@${BASELINE:0:7}"
            else
              BASELINE_REF="${BASELINE:0:7}"
            fi
          fi
          echo "ref=$BASELINE_REF" >> $GITHUB_OUTPUT

      - name: Checkout baseline version
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          fetch-depth: 1

      - name: Build current workload image
        uses: docker/build-push-action@v7
        with:
          context: current
          file: current/tests/slo/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ydb-app-current
          build-args: |
            SRC_PATH=${{ matrix.sdk.path }}
          cache-from: type=gha,scope=slo-deps
          # Use one producer to avoid concurrent writes to the shared cache scope.
          cache-to: ${{ matrix.sdk.name == 'native-query' && 'type=gha,scope=slo-deps,mode=max,ignore-error=true' || '' }}

      - name: Sync baseline workload sources
        run: |
          SYNC="$GITHUB_WORKSPACE/current/.github/scripts/sync-slo-workload-from-current.sh"
          chmod +x "$SYNC"

          # Keep workload code (and shared internal helpers) on current so baseline
          # runs the same workload against the baseline SDK via tests/slo/go.mod replace.
          bash "$SYNC" \
            --target "$GITHUB_WORKSPACE/baseline" \
            --source "$GITHUB_WORKSPACE/current" \
            --workload-path "${{ matrix.sdk.path }}"

      - name: Build baseline workload image
        id: build-baseline
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: baseline
          file: baseline/tests/slo/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ydb-app-baseline
          build-args: |
            SRC_PATH=${{ matrix.sdk.path }}
          cache-from: type=gha,scope=slo-deps

      - name: Use current workload image as baseline fallback
        if: steps.build-baseline.outcome == 'failure'
        run: |
          echo "::warning::Baseline Docker build failed; using the current workload image"
          docker tag ydb-app-current ydb-app-baseline

      - name: Run SLO Tests
        uses: ydb-platform/ydb-slo-action/init@v2
        timeout-minutes: 30
        with:
          github_issue: ${{ github.event.inputs.github_issue }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}
          workload_duration: ${{ inputs.slo_workload_duration_seconds || '600' }}
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: ${{ matrix.sdk.command }}
          workload_baseline_ref: ${{ steps.baseline.outputs.ref }}
          workload_baseline_image: ydb-app-baseline
          workload_baseline_command: ${{ matrix.sdk.command }}
          disable_compose_profiles: "${{ (matrix.sdk.name == 'native-table-node-hints' || matrix.sdk.name == 'native-query-node-hints') && 'chaos' || '' }}"
          metrics_yaml: ${{ matrix.sdk.metrics_yaml }}

      - name: Setup Go
        if: always()
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Collect flamegraphs
        if: always()
        run: |
          chmod +x "$GITHUB_WORKSPACE/current/.github/scripts/collect-slo-flamegraphs.sh"
          bash "$GITHUB_WORKSPACE/current/.github/scripts/collect-slo-flamegraphs.sh" \
            --output-dir "$GITHUB_WORKSPACE/.slo/extra/flamegraphs" \
            --workload "${{ matrix.sdk.name }}"
