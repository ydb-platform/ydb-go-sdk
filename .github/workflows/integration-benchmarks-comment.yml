name: integration-benchmarks-comment

on:
  workflow_run:
    workflows: [integration-benchmarks]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: integration-benchstat
          path: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const metadata = JSON.parse(fs.readFileSync('benchmark-results/metadata.json', 'utf8'));
            const sha = /^[0-9a-f]{40}$/;
            if (!Number.isSafeInteger(metadata.pr) || metadata.pr <= 0 ||
                !sha.test(metadata.master_sha) || !sha.test(metadata.head_sha) ||
                metadata.head_sha !== run.head_sha) {
              throw new Error('Invalid benchmark artifact metadata');
            }
            if (run.pull_requests?.length &&
                !run.pull_requests.some(pr => pr.number === metadata.pr)) {
              throw new Error('Benchmark artifact belongs to another pull request');
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: metadata.pr });
            if (pr.state !== 'open' || pr.base.ref !== 'master' ||
                pr.head.sha !== metadata.head_sha ||
                !pr.labels.some(label => label.name === 'run_intergration_benchmarks')) {
              core.info('Pull request changed or label was removed; skipping stale report');
              return;
            }

            const report = fs.readFileSync('benchmark-results/benchstat.txt', 'utf8');
            if (!report.trim() || report.length > 55000) {
              throw new Error('Benchmark report is empty or too large for a PR comment');
            }
            const marker = '<!-- integration-benchstat -->';
            const body = [
              marker,
              '### Integration benchmark comparison',
              `Master: \`${metadata.master_sha}\` · PR: \`${metadata.head_sha}\``,
              'Go 1.27.x, local YDB 26.3.1.16, ten runs per benchmark, 100ms benchmark time.',
              'Raw results are attached to the benchmark workflow run.',
              '',
              ...report.trimEnd().split('\n').map(line => `    ${line}`),
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: metadata.pr, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: metadata.pr, body });
            }
