name: sdk-benchmarks

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  compare:
    if: contains(github.event.pull_request.labels.*.name, 'run_sdk_benchmarks')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: sdk-benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout master revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: master
          persist-credentials: false

      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: master/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da

      - name: Correct historical benchmark assertion in master checkout
        shell: bash
        run: |
          # Master expects trace flags 00 even though traceparent emits 01.
          # Apply the same test-only correction as this PR to keep the baseline runnable.
          sed -i 's/729d847ca290963e-00/729d847ca290963e-01/' master/spans/driver_test.go

      - name: Benchmark master SDK packages
        working-directory: master
        shell: bash
        run: |
          mkdir -p ../benchmark-results
          go test -run '^$' -bench . -benchtime=100ms -count=10 -benchmem -cpu=2 -timeout=90m ./... | tee ../benchmark-results/master.txt
          grep -q '^Benchmark' ../benchmark-results/master.txt

      - name: Benchmark PR SDK packages
        working-directory: pr
        shell: bash
        run: |
          go test -run '^$' -bench . -benchtime=100ms -count=10 -benchmem -cpu=2 -timeout=90m ./... | tee ../benchmark-results/pr.txt
          grep -q '^Benchmark' ../benchmark-results/pr.txt

      - name: Compare results
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MASTER_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          "$(go env GOPATH)/bin/benchstat" master=benchmark-results/master.txt pr=benchmark-results/pr.txt > benchmark-results/benchstat.txt
          test -s benchmark-results/benchstat.txt
          jq -n --argjson pr "$PR_NUMBER" --arg master "$MASTER_SHA" --arg head "$PR_SHA" \
            '{pr: $pr, master_sha: $master, head_sha: $head}' > benchmark-results/metadata.json
          cat benchmark-results/benchstat.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-benchstat
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 30

  comment:
    needs: compare
    if: needs.compare.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: sdk-benchstat
          path: benchmark-results

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metadata = JSON.parse(fs.readFileSync('benchmark-results/metadata.json', 'utf8'));
            const event = context.payload.pull_request;
            if (metadata.pr !== event.number || metadata.head_sha !== event.head.sha ||
                metadata.master_sha !== event.base.sha) {
              throw new Error('Benchmark artifact does not match this pull request');
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: metadata.pr });
            if (pr.state !== 'open' || pr.head.sha !== metadata.head_sha ||
                !pr.labels.some(label => label.name === 'run_sdk_benchmarks')) {
              core.info('Pull request changed or label was removed; skipping stale report');
              return;
            }

            const report = fs.readFileSync('benchmark-results/benchstat.txt', 'utf8');
            if (!report.trim() || report.length > 55000) {
              throw new Error('Benchmark report is empty or too large for a PR comment');
            }
            const marker = '<!-- sdk-benchstat -->';
            const body = [
              marker,
              '### SDK benchmark comparison',
              `Master: \`${metadata.master_sha}\` · PR: \`${metadata.head_sha}\``,
              'Go 1.27.x, ten runs per benchmark, 100ms benchmark time.',
              `[Raw results and benchstat artifact](https://github.com/${owner}/${repo}/actions/runs/${context.runId}).`,
              '',
              ...report.trimEnd().split('\n').map(line => `    ${line}`),
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: metadata.pr, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: metadata.pr, body });
            }
