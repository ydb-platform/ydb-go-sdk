name: integration-benchmarks

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  compare:
    if: contains(github.event.pull_request.labels.*.name, 'run_intergration_benchmarks')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: integration-benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    services:
      ydb:
        image: ydbplatform/local-ydb:26.3.1.16
        ports:
          - 2135:2135
          - 2136:2136
          - 8765:8765
        volumes:
          - /tmp/ydb_certs:/ydb_certs
        env:
          YDB_FEATURE_FLAGS: enable_external_data_sources
          YDB_LOCAL_SURVIVE_RESTART: true
          YDB_USE_IN_MEMORY_PDISKS: true
          YDB_TABLE_ENABLE_PREPARED_DDL: true
          YDB_ENABLE_COLUMN_TABLES: true
        options: '-h localhost --name ydb'
    env:
      YDB_CONNECTION_STRING: grpc://localhost:2136/local
      YDB_CONNECTION_STRING_SECURE: grpcs://localhost:2135/local
      YDB_SSL_ROOT_CERTIFICATES_FILE: /tmp/ydb_certs/ca.pem
      YDB_SESSIONS_SHUTDOWN_URLS: http://localhost:8765/actors/kqp_proxy?force_shutdown=all
      HIDE_APPLICATION_OUTPUT: 1
    steps:
      - name: Checkout master revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: master
          persist-credentials: false

      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: master/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da

      - name: Benchmark master
        working-directory: master
        shell: bash
        run: |
          mkdir -p ../benchmark-results
          go test -tags integration -run '^$' -bench . -benchtime=200ms -count=5 -benchmem -cpu=2 -timeout=90m ./tests/integration/... | tee ../benchmark-results/master.txt
          grep -q '^Benchmark' ../benchmark-results/master.txt

      - name: Benchmark PR
        working-directory: pr
        shell: bash
        run: |
          go test -tags integration -run '^$' -bench . -benchtime=200ms -count=5 -benchmem -cpu=2 -timeout=90m ./tests/integration/... | tee ../benchmark-results/pr.txt
          grep -q '^Benchmark' ../benchmark-results/pr.txt

      - name: Compare results
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MASTER_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          "$(go env GOPATH)/bin/benchstat" master=benchmark-results/master.txt pr=benchmark-results/pr.txt > benchmark-results/benchstat.txt
          test -s benchmark-results/benchstat.txt
          jq -n --argjson pr "$PR_NUMBER" --arg master "$MASTER_SHA" --arg head "$PR_SHA" \
            '{pr: $pr, master_sha: $master, head_sha: $head}' > benchmark-results/metadata.json
          cat benchmark-results/benchstat.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-benchstat
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 30
